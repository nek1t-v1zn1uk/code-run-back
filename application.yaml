spring:
  cache:
    redis:
      time-to-live: 15m
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  Jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
    url: ${POSTGRES_URL}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  upload-dir: ./uploads
  isolate-socket-path: /var/run/code-run-isolate-daemon.sock
  admin:
    email: ${ADMIN_EMAIL:admin@coderun.local}
    password: ${ADMIN_PASSWORD:admin}

springdoc:
  swagger-ui:
    filter: true
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
    deep-linking: true
    default-model-expand-depth: 1
    syntax-highlight:
      activated: true
      theme: monokai